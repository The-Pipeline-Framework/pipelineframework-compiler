name: Qualify TPF Node generation

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full application commit SHA
        type: string
        required: true
      compiler_sha:
        description: Full compiler SHA matching the reusable workflow pin
        type: string
        required: true
      project:
        description: Repository-relative project directory
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  generate:
    uses: The-Pipeline-Framework/pipelineframework-compiler/.github/workflows/tpf-node-generation.yml@9b9172c8b4fd98b664bd14eb9b22f72dddb2b92f
    with:
      source_sha: ${{ inputs.source_sha }}
      compiler_sha: ${{ inputs.compiler_sha }}
      project: ${{ inputs.project }}
