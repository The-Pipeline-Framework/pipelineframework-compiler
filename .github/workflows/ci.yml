name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify
        run: ./mvnw clean verify -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Publish compiler coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-coverage
          path: |
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14
