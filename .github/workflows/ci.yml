name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  TPF_CENSUS_ENABLED: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Test Node generation tooling
        run: node --test scripts/test-node-generation.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify approved census marker in the packaged JAR
        run: |
          ./mvnw clean verify -DskipTests -Dtpf.census.release=true \
            -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Verify
        run: |
          ./mvnw clean verify -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository" \
            -Dtpf.census.senderTrials=2 -Dtpf.census.parallel=true \
            -Dtpf.nodeGeneration.smokeDir="$GITHUB_WORKSPACE/target/node-generation-smoke" \
            -Dtpf.pythonGeneration.smokeDir="$GITHUB_WORKSPACE/target/python-generation-smoke"
      - name: Type-check generated Node bindings
        run: |
          npm exec --yes --package=typescript@5.9.3 -- tsc --strict --noEmit --module NodeNext --target ES2022 \
            target/node-generation-smoke/handler-types.ts
      - name: Check generated Python bindings without Node or Java
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/target/python-generation-smoke:/work:ro" -w /work \
            python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016 \
            sh -ec '
              test -z "$(command -v node)"
              test -z "$(command -v java)"
              pip install --disable-pip-version-check mypy==1.18.2 mypy_extensions==1.1.0 pathspec==0.12.1 typing_extensions==4.15.0
              python -B -m unittest discover -p test_generated_bindings.py
              python -B check_types.py
            '
      - name: Publish compiler coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-coverage
          path: |
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14

  python-generation-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the Python client without Node or Java
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            python:3.12-slim@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016 \
            sh -ec '
              test "$(python -c "import platform; print(platform.python_version())")" = 3.12.15
              test -z "$(command -v node)"
              test -z "$(command -v java)"
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git
              python -B -m unittest discover -s scripts -p test_remote_node_generation.py
            '
