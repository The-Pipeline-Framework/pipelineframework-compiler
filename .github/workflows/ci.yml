name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  polyglot-projection-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Generate research projection into temporary output
        # Keep committed outputs untouched so the following byte-for-byte drift checks can fail.
        run: python3 conformance/polyglot-projection-v0/run.py --output target/polyglot-projection-v0/ci-generated
      - name: Check closed profile, generated drift and Java reference
        run: |
          python3 -m venv target/polyglot-projection-v0/test-venv
          target/polyglot-projection-v0/test-venv/bin/python -m pip install -r conformance/polyglot-projection-v0/requirements-test.txt
          target/polyglot-projection-v0/test-venv/bin/python -B -m unittest discover -s conformance/polyglot-projection-v0 -p 'test_*.py'
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Verify
        run: ./mvnw clean verify -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
      - name: Publish compiler coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-coverage
          path: |
            target/site/jacoco/**
            target/jacoco.exec
          if-no-files-found: warn
          retention-days: 14
