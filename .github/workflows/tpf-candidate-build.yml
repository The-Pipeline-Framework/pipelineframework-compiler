name: TPF Candidate Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tpf-candidate-build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-path: ${{ github.workspace }}/.m2/repository
      - name: Prepare exact source revision candidate version
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: bash scripts/prepare-candidate.sh "$EVENT_NAME" "${PR_NUMBER:--}" "$SOURCE_SHA"
      - name: Check candidate version and reactor coordinates
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: bash scripts/system-tests.sh candidate-version "$EVENT_NAME" "${PR_NUMBER:--}" "$SOURCE_SHA" && bash scripts/system-tests.sh reactor-coordinates && bash scripts/system-tests.sh reactor-dependencies
      - name: Build and install exact candidate reactor
        run: ./mvnw -B -Dmaven.repo.local="$PWD/.m2/repository" -Dmaven.deploy.skip=true -Dgpg.skip=true -Dtpf.flatten.skip=true clean install
      - name: Collect Maven files and preliminary build metadata
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bash scripts/collect-candidate-files.sh "$RUNNER_TEMP/tpf-candidate-build"
          cp "$RUNNER_TEMP/tpf-candidate-version.json" "$RUNNER_TEMP/tpf-candidate-build/candidate-manifest.json"
          python3 scripts/create-build-metadata.py "$RUNNER_TEMP/tpf-candidate-build"
      - name: Upload candidate files and preliminary build metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: tpf-candidate-build
          path: ${{ runner.temp }}/tpf-candidate-build
          if-no-files-found: error
          retention-days: 7
